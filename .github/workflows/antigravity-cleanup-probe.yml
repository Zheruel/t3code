name: Antigravity cleanup Windows probe
on:
  push:
    branches: [probe/antigravity-cleanup-23877]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: false
          run-install: false
      - run: vp i --frozen-lockfile -- --yes
      - name: Focused Windows tests
        run: vp test run apps/server/src/provider/AntigravityRuntimeTemp.test.ts apps/server/src/provider/AntigravityInstallation.test.ts apps/server/src/textGeneration/AntigravityTextGeneration.test.ts
      - name: Official runtime install and isolated cleanup
        working-directory: apps/server
        shell: pwsh
        run: node --input-type=module --eval (Get-Content -Raw ../../.github/antigravity-cleanup-probe.mjs)
